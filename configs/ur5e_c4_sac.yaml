# Stretch 2: SAC + HER on C4 (no action noise: SAC explores through its entropy term). C4 = C3 + one sphere obstacle (radius 5-8 cm) near the midpoint of the start -> goal line (+-3 cm).
# Observation + obstacle centre and radius. Contact ends the episode with reward -1 / (1 - gamma) = -20
# (a plain -1 would make crashing early cheaper than failing slowly); success = reached and no collision.
# copy_info_dict passes info["collision"] to compute_reward so HER-relabelled samples keep the penalty.
env_id: UR5eReach-v0
env_kwargs: {random_start: true, observe_joints: true, goal_range: 0.5, goal_center: [0.0, 0.45, 0.30],
             orientation_goal: true, angle_threshold_deg: 15.0, goal_max_tilt_deg: 45.0,
             obstacle: true, obstacle_radius: [0.05, 0.08], obstacle_offset: 0.03, collision_penalty: 20.0}
algo: sac
total_steps: 30000
her: {goal_selection_strategy: future, n_sampled_goal: 4, copy_info_dict: true}
algo_kwargs: {gamma: 0.95, batch_size: 256, buffer_size: 100000, learning_rate: 0.001}
policy_kwargs: {net_arch: [256, 256], n_critics: 2}
