# Phase C diagnostic "C4-lite": C4 without the orientation goal, from the fixed Phase B ready pose: position-only
# goal (5 cm), one sphere obstacle (radius 5-8 cm) near the start -> goal midpoint, collision ends the episode with
# reward -1 / (1 - gamma) = -20, copy_info_dict so HER keeps the penalty. Goal cube 0.5 m as C2-C4.
env_id: UR5eReach-v0
env_kwargs: {observe_joints: true, goal_range: 0.5, goal_center: [0.0, 0.45, 0.30],
             obstacle: true, obstacle_radius: [0.05, 0.08], obstacle_offset: 0.03, collision_penalty: 20.0}
algo: ddpg
total_steps: 100000
action_noise_sigma: 0.1
her: {goal_selection_strategy: future, n_sampled_goal: 4, copy_info_dict: true}
algo_kwargs: {gamma: 0.95, batch_size: 256, buffer_size: 100000, learning_rate: 0.001}
policy_kwargs: {net_arch: [256, 256], n_critics: 2}
