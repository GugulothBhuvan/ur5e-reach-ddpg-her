# Stretch 3: joint-space actions (6 joint-angle increments, 0.05 rad max, panda-gym's "joints" mode),
# otherwise identical DDPG + HER settings
env_id: UR5eReach-v0
env_kwargs: {control_type: joints}
algo: ddpg
total_steps: 100000
action_noise_sigma: 0.1
her: {goal_selection_strategy: future, n_sampled_goal: 4}
algo_kwargs: {gamma: 0.95, batch_size: 2048, buffer_size: 100000, learning_rate: 0.001}
policy_kwargs: {net_arch: [512, 512, 512], n_critics: 2}
