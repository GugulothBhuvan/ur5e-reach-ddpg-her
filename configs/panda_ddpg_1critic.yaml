# Phase A extra: pure DDPG (one critic). The tutorial's n_critics=2 adds TD3's clipped double-Q.
env_id: PandaReach-v3
algo: ddpg
total_steps: 100000
action_noise_sigma: 0.1
her: {goal_selection_strategy: future, n_sampled_goal: 4}
algo_kwargs: {gamma: 0.95, batch_size: 2048, buffer_size: 100000, learning_rate: 0.001}
policy_kwargs: {net_arch: [512, 512, 512], n_critics: 1}
