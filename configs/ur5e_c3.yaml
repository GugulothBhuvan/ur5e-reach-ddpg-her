# Phase C3: C2 (random start, joint angles observed, 0.5 m goal cube) + a target gripper orientation.
# Goals are 9 numbers (position + 6D orientation); success = within 5 cm AND within 15 deg; targets within
# 45 deg of gripper-down. Gripper actions: 6 numbers (5 cm displacement, 0.1 rad rotation), IK tracks the pose.
env_id: UR5eReach-v0
env_kwargs: {random_start: true, observe_joints: true, goal_range: 0.5, goal_center: [0.0, 0.45, 0.30],
             orientation_goal: true, angle_threshold_deg: 15.0, goal_max_tilt_deg: 45.0}
algo: ddpg
total_steps: 100000   # 30k (flat at 0 %), then extended to 100k to match C2's budget
action_noise_sigma: 0.1
her: {goal_selection_strategy: future, n_sampled_goal: 4}
algo_kwargs: {gamma: 0.95, batch_size: 256, buffer_size: 100000, learning_rate: 0.001}
policy_kwargs: {net_arch: [256, 256], n_critics: 2}
