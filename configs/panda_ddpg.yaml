# Phase A: the tutorial's settings on PandaReach-v3 (panda-gym 3.x port of PandaReach-v2)
env_id: PandaReach-v3
algo: ddpg
total_steps: 100000
action_noise_sigma: 0.1
her: {goal_selection_strategy: future, n_sampled_goal: 4}   # online_sampling removed in SB3 >= 1.8 (always online)
algo_kwargs: {gamma: 0.95, batch_size: 2048, buffer_size: 100000, learning_rate: 0.001}
policy_kwargs: {net_arch: [512, 512, 512], n_critics: 2}
